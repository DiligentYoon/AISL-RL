seed: 42

models:
  shared: True
  use_mlp: False
  
  policy:
    type: "BodyTransformer"
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
  value: 
    clip_actions: False

buffer:
  buffer_size: -1

agent:
  class: PPO
  rollouts: 32
  learning_epochs: 2
  mini_batches: 2
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 2.0e-04
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.0
  time_limit_bootstrap: True
  clip_predicted_values: False
  # logging and checkpoint
  experiment:
    directory: "humanoid_gnn"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

train:
  timesteps: 64000
