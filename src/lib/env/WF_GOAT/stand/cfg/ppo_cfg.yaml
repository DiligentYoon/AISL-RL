seed: 42

models:
  policy:  
    min_log_std: -20.0
    max_log_std: 2.0
  value: 
    clip_actions: False

  model_type: null
  squashed: False
  
buffer:
  buffer_size: -1

agent:
  class: PPO
  rollouts: 24
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 1.0e-05
  learning_rate_scheduler: KLAdaptive
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.01
  time_limit_bootstrap: True
  clip_predicted_values: False
  async_actor_critic: False
  
  # Action scaling (Env-specific)
  action_scale_factor:
    joint: null 
    wheel: null

  # Logging and checkpoint
  experiment:
    directory: "GOAT_stand"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

train:
  timesteps: 36000