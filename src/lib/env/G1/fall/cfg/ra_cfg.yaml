seed: 42

buffer:
  buffer_size: 64

agent:
  
  learning_epochs: 2
  batch_size: 4096
  discount_factor: 0.99
  learning_rate: 5.0e-05
  learning_starts: 32
  grad_norm_clip: 1.0

  # logging and checkpoint
  experiment:
    directory: "g1_fall"
    experiment_name: ""
    evaluation_interval: auto
    write_interval: auto
    checkpoint_interval: auto

train:
  timesteps: 64000
