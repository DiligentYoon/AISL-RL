seed: 42

buffer:
  buffer_size: 64

agent:
  learning_epochs: 2
  batch_size: 4096
  discount_factor: 0.9999
  learning_rate: 5.0e-05
  learning_starts: 32
  grad_norm_clip: 1.0

  # logging and checkpoint
  experiment:
    directory: "g1_fall"
    experiment_name: ""
    evaluation_interval: auto
    write_interval: auto
    checkpoint_interval: auto

collection:
  capacity_per_bucket: 200000
  thresholds:
    low_high: -0.3
    mid_high: 0.3
  max_timestep: 20000
  warmup_skip_steps: 4
  subsample_stride: 4
  save_subdir: "collected"

train:
  timesteps: 19200
